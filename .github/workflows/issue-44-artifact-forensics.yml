name: issue-44-artifact-forensics
on:
  push:
    branches:
      - security/issue-44-artifact-forensics
permissions:
  contents: read
  actions: read
jobs:
  artifacts:
    name: Forensic scan of every retained Actions artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout artifact forensics branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-$VERSION"
          mkdir -p "$INSTALL_DIR"
          ARCHIVE="$INSTALL_DIR/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_"$VERSION"_linux_x64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod 700 "$INSTALL_DIR/gitleaks"
          "$INSTALL_DIR/gitleaks" version
      - name: Download and inspect retained artifacts without unsafe extraction
        env:
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_WORKSPACE: \${{ github.workspace }}
          RUNNER_TEMP: \${{ runner.temp }}
          GITHUB_STEP_SUMMARY: \${{ github.step_summary }}
          GITLEAKS_BIN: \${{ runner.temp }}/gitleaks-8.30.1/gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/security/issue-44-artifact-forensics.py
