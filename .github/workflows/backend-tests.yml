name: backend-tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read            # nothing else is needed: no secrets, no deployments, no Cloud access

concurrency:
  group: backend-tests-full-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "static + OpenAPI contract + workflow lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Static tests, OpenAPI contract and workflow lint (logs retained)
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          find .ci-logs -maxdepth 1 -type f -delete
          status=0
          { node --version; npm test; } 2>&1 | tee .ci-logs/static-npm-test.log || status=1
          { pip install pyyaml && python3 -m unittest tests/contract_openapi.py -v; } 2>&1 | tee .ci-logs/openapi-contract.log || status=1
          { bash -n scripts/run-db-tests.sh scripts/run-local-integrations.sh tests/db/concurrency.sh && node --check tests/integration/local-supabase.integration.mjs && node --check tests/integration/cv-parse.integration.mjs && node --check tests/integration/career-cohort.integration.mjs && node --check tests/integration/onboarding.integration.mjs && node --check tests/integration/rate-limits.integration.mjs && node --check tests/integration/university-dataset.integration.mjs && node --check scripts/seed-university-demo.mjs && node --check scripts/provision-university-demo-users.mjs && node --check scripts/provision-demo-users.mjs && node --check scripts/evaluate-cv-parser-local.mjs && bash -n scripts/run-university-seed-smoke.sh; } 2>&1 | tee .ci-logs/syntax-check.log || status=1
          { python3 -m unittest tests/workflow_lint.py -v; } 2>&1 | tee .ci-logs/workflow-lint.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-test-logs
          path: |
            .ci-logs/static-npm-test.log
            .ci-logs/openapi-contract.log
            .ci-logs/syntax-check.log
            .ci-logs/workflow-lint.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  university-seed-smoke:
    name: "synthetic university seed (isolated disposable local Supabase)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify Docker and install PostgreSQL client
        run: |
          docker --version
          docker info --format 'docker server {{.ServerVersion}}'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
      - uses: supabase/setup-cli@v1
        with: { version: "3.3.0" }
      - name: Prepare fresh smoke diagnostics
        run: |
          mkdir -p .ci-logs
          find .ci-logs -maxdepth 1 -type f -delete
      - name: Run local synthetic dataset provisioning and idempotency proof
        # The script tees internally and returns its original failure code. Do not wrap it in
        # an outer tee pipeline: that could make GitHub report success when the script fails.
        run: bash scripts/run-university-seed-smoke.sh
      - name: Verify explicit smoke success marker and idempotency evidence
        if: success()
        run: |
          grep -Fxq "SMOKE RESULT: PASS" .ci-logs/university-seed-smoke.log
          grep -q "PASS: synthetic university seed applied twice" .ci-logs/university-seed-smoke.log
          grep -q "Auth first pass:" .ci-logs/university-seed-apply.log
          grep -q "First-pass counts:" .ci-logs/university-seed-apply.log
          grep -q "Second-pass counts:" .ci-logs/university-seed-apply.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-university-seed-smoke
          path: |
            .ci-logs/university-seed-smoke.log
            .ci-logs/university-seed-supabase-start.log
            .ci-logs/university-seed-db-reset.log
            .ci-logs/university-seed-build.log
            .ci-logs/graduate-demo-provision.log
            .ci-logs/university-seed-apply.log
            .ci-logs/university-seed-verification.log
            .ci-logs/university-seed-functions-serve.log
            .ci-logs/cv-parser-evaluation.log
            .ci-logs/cv-parser-evaluation.json
            .ci-logs/supabase-stop.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable local Supabase
        if: always()
        run: timeout 120s supabase stop --no-backup || true

  database:
    name: "database (disposable local Supabase - migrations, pgTAP, RLS, storage, concurrency)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify Docker on the runner
        run: |
          sed -n '1,3p' /etc/os-release
          docker --version
          docker info --format 'docker server {{.ServerVersion}}'
          docker compose version
      - name: Install and verify the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version
          pg_isready --version
      - uses: supabase/setup-cli@v1
        with: { version: "3.3.0" }   # pinned to the version verified by CI run #52
      - name: Verify Supabase CLI
        run: |
          command -v supabase
          timeout 30s supabase --version
      - name: Prepare fresh database diagnostics
        run: |
          mkdir -p .ci-logs
          find .ci-logs -maxdepth 1 -type f -delete
      - name: "Database tests (local stack only, fails on any error)"
        run: bash scripts/run-db-tests.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .ci-logs
          redact_log() {
            sed -E \
              -e 's/sb_secret_[A-Za-z0-9_-]{20,}/[REDACTED_LOCAL_SUPABASE_SECRET]/g' \
              -e 's/sb_publishable_[A-Za-z0-9_-]{20,}/[REDACTED_LOCAL_SUPABASE_PUBLISHABLE]/g' \
              -e 's/^[[:space:]│]*(Secret Key|Publishable Key|Anon Key|Service Role Key|JWT Secret|DB URL)[[:space:]│]*.*/[REDACTED_LOCAL_SUPABASE_VALUE]/' \
              -e 's/eyJ[A-Za-z0-9_-]{20,}[.][A-Za-z0-9_-]{10,}[.][A-Za-z0-9_-]{10,}/[REDACTED_LOCAL_JWT]/g' \
              -e 's/(SERVICE_ROLE_KEY|ANON_KEY|JWT_SECRET|DB_PASSWORD|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY)[[:space:]]*=[[:space:]]*[^[:space:]]+/[REDACTED_CREDENTIAL_ASSIGNMENT]/Ig' \
              -e 's/Authorization: Bearer [A-Za-z0-9._-]{20,}/Authorization: Bearer [REDACTED]/Ig' \
              -e 's/apikey: [A-Za-z0-9._-]{20,}/apikey: [REDACTED]/Ig'
          }
          supabase status 2>&1 | redact_log > .ci-logs/supabase-status.txt || true
          docker ps -a 2>&1 | redact_log > .ci-logs/docker-ps.txt || true
          docker logs supabase_db_alumni-connect-backend 2>&1 | redact_log > .ci-logs/db-container.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-logs
          path: .ci-logs/
          # .ci-logs is a dot-directory: upload-artifact v4 skips hidden files unless this is set.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: career-cohort-reports
          path: career-cohort-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: timeout 120s supabase stop --no-backup || true
