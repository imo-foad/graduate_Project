    post:
      summary: Verify that the authenticated account has an active, email-confirmed platform-admin membership
      responses:
        '200': { description: true }
        '403': { description: ADMIN_REQUIRED }
  /rest/v1/rpc/get_scholarship_review_cv_path:
    post:
      summary: Return a private Storage path only to a platform admin or a reviewer assigned to the application's provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_application_id]
              properties:
                p_application_id: { type: string, format: uuid }
      responses:
        '200':
          description: Private Storage path (null when no CV was attached); use the reviewer Edge Function for a signed URL
          content:
            application/json:
              schema:
                type: string
                nullable: true
        '403': { description: SCHOLARSHIP_REVIEWER_REQUIRED }
        '404': { description: SCHOLARSHIP_APPLICATION_NOT_FOUND }
        '409': { description: SCHOLARSHIP_APPLICATION_NOT_REVIEWABLE }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /functions/v1/submit-scholarship:
    post:
      summary: Submit a scholarship application and trigger the first signed, idempotent provider delivery attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_opportunity_id]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_cv_document_id: { type: string, format: uuid, nullable: true }
                p_personal_statement: { type: string, maxLength: 10000, nullable: true }
                p_application_data:
                  type: object
                  description: JSON object no larger than 32 KiB.
      responses:
        '200': { description: Internal Scholarship submission recorded (SUBMITTED) or provider receipt acknowledged (SUBMITTED_EXTERNALLY) }
        '202': { description: Application persisted but delivery is pending or blocked; response never claims external submission }
        '400': { description: INVALID_REQUEST }
        '401': { description: UNAUTHENTICATED }
        '409': { description: ALREADY_APPLIED }
        '422': { description: Invalid scholarship, closed opportunity or eligibility failure }
  /functions/v1/deliver-scholarship:
    post:
      summary: Process due outbox items with service-role credentials, or retry one application as platform admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                application_id: { type: string, format: uuid, nullable: true }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { description: Processed delivery outcomes }
        '400': { description: Invalid worker input }
        '401': { description: UNAUTHENTICATED }
        '403': { description: ADMIN_REQUIRED }
        '503': { description: Worker or provider configuration unavailable }
  /functions/v1/get-scholarship-review-cv:
    post:
      summary: Return a 10-minute private CV download URL only to an active reviewer assigned to the application's provider or a platform admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id]
              properties:
                application_id: { type: string, format: uuid }
      responses:
        '200':
          description: CV link available or the application has no CV attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id: { type: string, format: uuid }
                  cv_available: { type: boolean }
                  download_url: { type: string, format: uri, nullable: true }
                  expires_in_seconds: { type: integer, nullable: true }
        '400': { description: Invalid request }
        '401': { description: UNAUTHENTICATED }
        '403': { description: SCHOLARSHIP_REVIEWER_REQUIRED }
        '404': { description: SCHOLARSHIP_APPLICATION_NOT_FOUND }
        '409': { description: SCHOLARSHIP_APPLICATION_NOT_REVIEWABLE }
        '503': { description: Signed URL unavailable }
  /functions/v1/scholarship-provider-callback:
    post:
      summary: Receive provider review events authenticated by raw-body HMAC-SHA256 (no Supabase JWT)
      description: >-
        The provider sends X-Alumni-Timestamp (Unix seconds) and X-Alumni-Signature
        (sha256 hex). The signature covers timestamp + "." + the exact raw JSON body,
        using that provider's webhook_secret. Timestamps older than five minutes are rejected.
        Provider event_id is idempotent; reusing it with a changed payload is rejected.
      security: []
      parameters:
        - name: X-Alumni-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9]{10}$" }
        - name: X-Alumni-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[a-f0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_key, event_id, application_reference, status]
              properties:
                provider_key: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,63}$" }
                event_id: { type: string, minLength: 1, maxLength: 200 }
                application_reference: { type: string, minLength: 1, maxLength: 200 }
                status: { type: string, enum: [IN_REVIEW, ACCEPTED, REJECTED] }
                note: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Provider event accepted; duplicate event returns result DUPLICATE }
        '400': { description: Invalid body or signature timestamp format }
        '401': { description: Invalid HMAC signature or unknown provider }
        '413': { description: Request body exceeds the 16 KiB limit }
        '404': { description: Provider application reference not found }
        '409': { description: Invalid transition or provider event id reused with another payload }
        '503': { description: Provider callback could not be committed; provider may retry the same event id }
  /functions/v1/submit-competition:
    post:
      summary: Submit a Competition entry and attempt configured organizer delivery
      description: Requires the graduate JWT. Internal/sample listings remain local. HTTP 202 means saved but external delivery is still pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_opportunity_id]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_cv_document_id: { type: string, format: uuid, nullable: true }
                p_personal_statement: { type: string, maxLength: 10000, nullable: true }
                p_submission_data:
                  type: object
                  additionalProperties: true
                  description: Flexible organizer entry answers; maximum 32 KiB.
      responses:
        '200': { description: Entry saved; internal entries remain internal and successful external deliveries have provider acknowledgement }
        '202': { description: Entry saved; delivery is pending or retryable }
        '400': { description: Invalid request body }
        '401': { description: Missing or invalid graduate JWT }
        '413': { description: Request body exceeds the 64 KiB limit }
        '404': { description: Opportunity or CV not found }
        '409': { description: Duplicate entry }
        '422': { description: Opportunity is not an eligible open Competition }
        '500': { description: Submission processing failed; inspect persisted status before retrying }
  /functions/v1/deliver-competition:
    post:
      summary: Process pending Competition delivery or retry one application
      description: Trusted scheduler uses service role; active admins may request a single-application retry with a user JWT. Never ship the service-role key to Android.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                application_id: { type: string, format: uuid }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200': { description: Processed count and per-application outcomes }
        '400': { description: Invalid request or application_id required for admin retry }
        '401': { description: Missing or invalid credential }
        '413': { description: Request body exceeds the 8 KiB limit }
        '403': { description: Active platform administrator required for user-token retry }
        '503': { description: Delivery worker unavailable }
  /functions/v1/competition-provider-callback:
    post:
      summary: Receive a signed Competition organizer status event
      description: HMAC signature covers the exact raw request body and timestamp. No Supabase JWT or API key is used as a substitute.
      security: []
      parameters:
        - in: header
          name: X-Alumni-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: X-Alumni-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider_key, event_id, application_reference, status]
              properties:
                provider_key: { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{1,63}$' }
                event_id: { type: string, minLength: 1, maxLength: 200 }
                application_reference: { type: string, minLength: 1, maxLength: 200 }
                status: { type: string, enum: [IN_REVIEW, ACCEPTED, REJECTED] }
                note: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Signed event accepted or recognized as an idempotent duplicate }
        '400': { description: Invalid callback body }
        '401': { description: Unknown provider or invalid signature }
        '409': { description: Provider event conflicts with a prior event or status transition }
        '413': { description: Callback body exceeds 16 KiB }
        '503': { description: Provider configuration or event processing unavailable }
  /functions/v1/get-competition-review-cv:
    post:
      summary: Obtain a short-lived signed CV download URL for an assigned Competition reviewer
      description: Requires an active provider-scoped reviewer or platform-admin JWT. Signed URL expires after 600 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [application_id]
              properties:
                application_id: { type: string, format: uuid }
      responses:
        '200': { description: CV availability and a 10-minute signed download URL when a CV is attached }
        '400': { description: Invalid request body }
        '401': { description: Missing or invalid JWT }
        '403': { description: Reviewer is not assigned to the application's provider }
        '413': { description: Request body exceeds the 4 KiB limit }
        '404': { description: Application not found }
        '409': { description: Application cannot be reviewed or storage path is invalid }
        '503': { description: CV authorization or signed URL service unavailable }
  /functions/v1/recommend:
    post:
      summary: Compute (only when inputs changed or force=true) and return ranked recommendations. Deterministic scoring;
        no external AI call in v0.1.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                    - cache
                    - computed
                  model_version:
                    type: string
                  ai_mode:
                    type: string
                    example: deterministic
                  disclaimer:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                  career_profile:
                    $ref: '#/components/schemas/CareerProfile'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
        '409':
          description: 'STALE_SNAPSHOT: profile kept changing during calculation (3 bounded attempts); previous cache is untouched;
            retry later'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
        '500':
          description: CANDIDATES_FAILED / SAVE_FAILED / READ_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
  /auth/v1/token:
    post:
      summary: Sign in (password grant) or renew the session (refresh_token grant). No pre-existing JWT is needed; the apikey
        header IS needed.
      security:
      - apiKeyAuth: []
      parameters:
      - name: grant_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - password
          - refresh_token
        description: password -> body PasswordGrantRequest; refresh_token -> body RefreshTokenGrantRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PasswordGrantRequest'
              - $ref: '#/components/schemas/RefreshTokenGrantRequest'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid credentials or invalid/used refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Missing or wrong apikey header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
