name: issue-44-incremental-unscanned-artifact-audit

on:
  push:
    branches:
      - security/issue-44-audit-main-2026-11-27
  workflow_run:
    workflows:
      - backend-tests
      - issue-44-artifact-forensics
      - issue-44-public-secret-audit
      - issue-44-incremental-unscanned-artifact-audit
    types:
      - completed
    branches:
      - security/issue-44-audit-main-2026-11-27
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-44-incremental-artifact-audit-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  incremental:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'security/issue-44-audit-main-2026-11-27' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.name != 'issue-44-incremental-unscanned-artifact-audit' || github.event.workflow_run.event == 'push'))
    name: Scan Actions artifacts and logs newer than prior forensic cutoff
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout audit scanner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$INSTALL_DIR"
          ARCHIVE="$INSTALL_DIR/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod 700 "$INSTALL_DIR/gitleaks"
          "$INSTALL_DIR/gitleaks" version

      - name: Run scanner safety self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/security/issue-44-artifact-forensics.py
          python3 -m unittest discover -s tests/security -p 'test_issue_44_artifact_forensics.py' -v

      - name: Download and scan only the previously unscanned Actions scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
          ISSUE_44_PRIOR_RUN_CUTOFF: "2026-11-27T05:00:29Z"
          ISSUE_44_PRIOR_ARTIFACT_CUTOFF: "2026-11-27T05:01:29Z"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/security/issue-44-artifact-forensics.py
