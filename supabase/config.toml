project_id = "alumni-connect-backend"

[db]
major_version = 17   # matches the Cloud project (PostgreSQL 17.x)

[api]
schemas = ["public"]

[auth]
enable_signup = false   # demo accounts are provisioned by scripts/provision-demo-users.mjs

[auth.sms]
# Enables the GoTrue phone provider for phone/password login of locally provisioned users.
# Global [auth].enable_signup remains false: public phone/email signup is still disabled.
# Keep phone confirmation enabled; synthetic Auth Admin provisioning explicitly confirms test accounts.
enabled = true
enable_confirmations = true

[functions.recommend]
verify_jwt = true

[functions.parse-cv]
verify_jwt = true

[functions.invite-graduate]
verify_jwt = true

[functions.manage-graduate]
verify_jwt = true

[functions.delete-graduate]
verify_jwt = true

# Operator/cron-only worker: drains private.cv_cleanup_queue through the Storage API.
[functions.cleanup-cv-objects]
verify_jwt = true

# Public registration: the caller has no JWT yet. The handler uses the service role internally and
# never returns the National ID. Rate limiting belongs at the gateway/host level.
[functions.register]
verify_jwt = false

# Requires the phone-user JWT issued after OTP confirmation.
[functions.finalize-registration]
verify_jwt = true
