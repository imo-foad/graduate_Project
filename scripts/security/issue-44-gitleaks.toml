[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (including local-stack credentials)"
regex = '''sb_secret_[A-Za-z0-9_-]{22}_[A-Za-z0-9_-]{8}'''
keywords = ["sb_secret_"]
entropy = 2.5

[[rules]]
id = "supabase-personal-access-token"
description = "Supabase personal access token"
regex = '''\bsbp_(?:(?:v0|oauth)_)?[a-f0-9]{40}\b'''
keywords = ["sbp_"]
entropy = 3.0
