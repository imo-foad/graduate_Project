      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_user_id, p_provider_key, p_is_active]
              properties:
                p_user_id: { type: string, format: uuid }
                p_provider_key: { type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,63}$" }
                p_is_active: { type: boolean }
      responses:
        '200': { description: Reviewer assignment saved }
        '403': { description: ADMIN_REQUIRED }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/get_scholarship_review_queue:
    post:
      summary: Read provider-scoped scholarship submissions; platform admins can read all providers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                p_provider_key: { type: string, nullable: true }
                p_status: { type: string, enum: [PENDING_DELIVERY, SUBMITTED_EXTERNALLY, IN_REVIEW, ACCEPTED, REJECTED, DELIVERY_FAILED], nullable: true }
                p_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Provider-scoped review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    application_id: { type: string, format: uuid }
                    opportunity_id: { type: string, format: uuid }
                    opportunity_title: { type: string }
                    provider_key: { type: string }
                    graduate_id: { type: string, format: uuid }
                    graduate_name: { type: string }
                    graduate_email: { type: string }
                    cv_document_id: { type: string, format: uuid, nullable: true }
                    personal_statement: { type: string, nullable: true }
                    application_data: { type: object }
                    status: { type: string }
                    delivery_status: { type: string }
                    provider_application_reference: { type: string, nullable: true }
        '403': { description: SCHOLARSHIP_REVIEWER_REQUIRED }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/retry_scholarship_delivery:
