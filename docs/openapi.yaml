openapi: 3.0.3
info:
  title: Alumni Connect AI - Backend API (Supabase)
  version: 0.1.0
  description: 'Contract for the Android team. Every request needs `apikey: <anon key>`; every operation except the token
    endpoint also needs `Authorization: Bearer <user JWT>`. Errors from RPCs: HTTP status = business meaning, `message` =
    stable error code, `details` = optional extra. All data is synthetic. Match Score is NOT a hiring probability.'
servers:
- url: '{supabaseUrl}'
  variables:
    supabaseUrl:
      default: http://127.0.0.1:54321
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Project anon/publishable key. Required on EVERY request, including login. Safe to ship in the app.
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access_token from /auth/v1/token. Required on every operation except the token endpoint itself.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: ALREADY_APPLIED
        details:
          type: string
          nullable: true
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opportunity_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - SHORTLISTED
          - INTERVIEW
          - ACCEPTED
          - REJECTED
          - WITHDRAWN
          - SAMPLE_UNDER_REVIEW
          - SAMPLE_INTERVIEW
          - SAMPLE_ACCEPTED
          - SAMPLE_REJECTED
        status_source:
          type: string
          enum:
          - APP_ACTION
          - COMPANY_ACTION
          - ADMIN_ACTION
          - SEED_SAMPLE
        applied_at:
          type: string
          format: date-time
    AdminScholarshipOpportunity:
      type: object
      description: Internal Alumni Connect Scholarship listing returned to platform admins.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [SCHOLARSHIP] }
        title: { type: string }
        organizer_name: { type: string }
        description: { type: string }
        location: { type: string, nullable: true }
        attendance_mode: { type: string, enum: [ONSITE, ONLINE, HYBRID] }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED, EXPIRED, CANCELLED] }
        deadline: { type: string, format: date-time, nullable: true }
        target_fields: { type: array, items: { type: string } }
        is_sample: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
    AdminScholarshipApplicationDetails:
      type: object
      properties:
        application_id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        scholarship_title: { type: string }
        is_sample: { type: boolean }
        graduate_id: { type: string, format: uuid }
        applicant_name: { type: string }
        applicant_college: { type: string, nullable: true }
        applicant_department: { type: string, nullable: true }
        applicant_major: { type: string, nullable: true }
        applicant_graduation_year: { type: integer, nullable: true }
        applicant_degree: { type: string, nullable: true }
        applicant_location: { type: string, nullable: true }
        cv_document_id: { type: string, format: uuid, nullable: true }
        cv_storage_path: { type: string, nullable: true, description: Storage object path; downloadable only when attached to a Scholarship application by an active platform admin. }
        personal_statement: { type: string, maxLength: 10000, nullable: true }
        application_data:
          type: object
          description: Flexible JSON answers supplied with the current CV + personal statement form.
          additionalProperties: true
        status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, ACCEPTED, REJECTED, WITHDRAWN] }
        applied_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScholarshipApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        cv_document_id: { type: string, format: uuid, nullable: true }
        personal_statement: { type: string, maxLength: 10000, nullable: true }
        application_data:
          type: object
          description: Internal Alumni Connect Scholarship answers, maximum 32 KiB; the current form is CV, personal statement and flexible JSON.
          additionalProperties: true
        status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, PENDING_DELIVERY, SUBMITTED_EXTERNALLY, IN_REVIEW, ACCEPTED, REJECTED, DELIVERY_FAILED, INTERNAL_ONLY, WITHDRAWN] }
        delivery_status: { type: string, enum: [NOT_REQUIRED, BLOCKED, PENDING, PROCESSING, DELIVERED, FAILED, CANCELLED] }
        provider_key: { type: string, nullable: true }
        provider_application_reference: { type: string, nullable: true }
        externally_submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        reviewed_by: { type: string, format: uuid, nullable: true }
        review_note: { type: string, nullable: true }
        applied_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScholarshipApplicationHistory:
      type: object
      properties:
        id: { type: string, format: uuid }
        scholarship_application_id: { type: string, format: uuid }
        old_status: { type: string, nullable: true }
        new_status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, PENDING_DELIVERY, SUBMITTED_EXTERNALLY, IN_REVIEW, ACCEPTED, REJECTED, DELIVERY_FAILED, INTERNAL_ONLY, WITHDRAWN] }
        source_type: { type: string, enum: [GRADUATE_ACTION, ADMIN_ACTION, SYSTEM, PROVIDER, REVIEWER, ADMIN] }
        changed_at: { type: string, format: date-time }
    CompetitionApplication:
      type: object
      properties:
        id: { type: string, format: uuid }
        opportunity_id: { type: string, format: uuid }
        cv_document_id: { type: string, format: uuid, nullable: true }
        personal_statement: { type: string, maxLength: 10000, nullable: true }
        submission_data:
          type: object
          description: Flexible competition entry payload, maximum 32 KiB; no team or judging contract is defined.
          additionalProperties: true
        status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, PENDING_DELIVERY, SUBMITTED_EXTERNALLY, IN_REVIEW, ACCEPTED, REJECTED, DELIVERY_FAILED, INTERNAL_ONLY, WITHDRAWN] }
        delivery_status: { type: string, enum: [NOT_REQUIRED, BLOCKED, PENDING, PROCESSING, DELIVERED, FAILED, CANCELLED] }
        provider_key: { type: string, nullable: true }
        provider_application_reference: { type: string, nullable: true }
        externally_submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        reviewed_by: { type: string, format: uuid, nullable: true }
        review_note: { type: string, nullable: true }
        applied_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompetitionApplicationHistory:
      type: object
      properties:
        id: { type: string, format: uuid }
        competition_application_id: { type: string, format: uuid }
        old_status: { type: string, nullable: true }
        new_status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, PENDING_DELIVERY, SUBMITTED_EXTERNALLY, IN_REVIEW, ACCEPTED, REJECTED, DELIVERY_FAILED, INTERNAL_ONLY, WITHDRAWN] }
        source_type: { type: string, enum: [GRADUATE_ACTION, ADMIN_ACTION, SYSTEM, PROVIDER, REVIEWER, ADMIN] }
        changed_at: { type: string, format: date-time }
    SocialPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 5000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SocialFeedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        author_name: { type: string }
        author_avatar_url: { type: string, nullable: true }
        content: { type: string, minLength: 1, maxLength: 5000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        likes_count: { type: integer, format: int64 }
        comments_count: { type: integer, format: int64 }
        liked_by_me: { type: boolean }
    SocialComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author_name: { type: string }
        author_avatar_url: { type: string, nullable: true }
        content: { type: string, minLength: 1, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SocialCommentMutation:
      type: object
      description: Mutation response returned to the authenticated comment author; author_id is the caller's own id.
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opportunity_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - REGISTERED
          - WAITLISTED
          - CANCELLED
    CareerRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
        job_title:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        is_current:
          type: boolean
    Recommendation:
      type: object
      properties:
        opportunity_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Match Score (not an acceptance probability)
        band:
          type: string
          enum:
          - HIGH
          - GOOD
          - MEDIUM
          - LOW
        matched_skill_ids:
          type: array
          items:
            type: string
        missing_skill_ids:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: object
        reasons:
          type: array
          items:
            type: string
        explanation_ar:
          type: string
        model_version:
          type: string
        generated_at:
          type: string
          format: date-time
        opportunity:
          type: object
          description: Embedded opportunity (id,type,title,company_name,location,attendance_mode,status,deadline,start_at,end_at)
    CareerSkillEvidence:
      type: object
      required: [skill_id, level, role, weight, contribution]
      properties:
        skill_id: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        role: { type: string, enum: [CORE, SUPPORTING] }
        weight: { type: integer, minimum: 1 }
        contribution: { type: number, minimum: 0, maximum: 100 }
    CareerPathMatch:
      type: object
      required:
      - id
      - label
      - score
      - matched_skill_ids
      - matched_core_skill_ids
      - matched_supporting_skill_ids
      - specialization_signal_skill_ids
      - missing_core_skill_ids
      - next_skill_ids
      - core_match_count
      - required_core_match_count
      - skill_evidence
      - explanation_ar
      properties:
        id: { type: string }
        label: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Weighted confirmed-skill coverage, not a hiring probability.
        matched_skill_ids:
          type: array
          items: { type: string }
        matched_core_skill_ids:
          type: array
          items: { type: string }
        matched_supporting_skill_ids:
          type: array
          items: { type: string }
        specialization_signal_skill_ids:
          type: array
          description: Matched core skills satisfying any required specialization gate for this path.
          items: { type: string }
        missing_core_skill_ids:
          type: array
          items: { type: string }
        next_skill_ids:
          type: array
          maxItems: 3
          items: { type: string }
        core_match_count: { type: integer, minimum: 0 }
        required_core_match_count: { type: integer, minimum: 1 }
        skill_evidence:
          type: array
          items: { $ref: '#/components/schemas/CareerSkillEvidence' }
        explanation_ar: { type: string }
    CareerProfile:
      type: object
      required: [primary_path, paths, disclaimer]
      properties:
        primary_path:
          allOf:
          - $ref: '#/components/schemas/CareerPathMatch'
          nullable: true
        paths:
          type: array
          description: Every path meeting the minimum core-skill evidence threshold, sorted by fit score.
          items: { $ref: '#/components/schemas/CareerPathMatch' }
        disclaimer: { type: string }
    PasswordGrantRequest:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    RefreshTokenGrantRequest:
      type: object
      required:
      - refresh_token
      additionalProperties: false
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
        expires_at:
          type: integer
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
    AuthError:
      type: object
      description: Supabase Auth error body (field set can vary by version; not verified against a live project).
      properties:
        code:
          type: integer
        error_code:
          type: string
          example: invalid_credentials
        msg:
          type: string
    GatewayError:
      type: object
      properties:
        message:
          type: string
          example: No API key found in request
    RecommendError:
      type: object
      properties:
        error:
          type: string
          enum:
          - UNAUTHENTICATED
          - METHOD_NOT_ALLOWED
          - CANDIDATES_FAILED
          - SAVE_FAILED
          - STALE_SNAPSHOT
          - READ_FAILED
          - PROFILE_SKILLS_READ_FAILED
        retryable:
          type: boolean
        attempts:
          type: integer
        code:
          type: string
  responses:
    BusinessError:
      description: >-
        HTTP status mirrors the business meaning; body.message is a stable code.
        401 UNAUTHENTICATED.
        403 ADMIN_REQUIRED, NOT_COMPANY_MEMBER, SCHOLARSHIP_REVIEWER_REQUIRED, COMPETITION_REVIEWER_REQUIRED, SERVICE_ROLE_REQUIRED.
        404 OPPORTUNITY_NOT_FOUND, APPLICATION_NOT_FOUND, REGISTRATION_NOT_FOUND, CV_NOT_FOUND, COMPANY_NOT_FOUND, USER_NOT_FOUND, MEMBERSHIP_NOT_FOUND, JOB_NOT_FOUND, RECOMMENDATION_NOT_FOUND, CV_SUGGESTION_NOT_FOUND, ACCOUNT_DELETION_REQUEST_NOT_FOUND, ADMIN_MEMBERSHIP_NOT_FOUND, SCHOLARSHIP_PROVIDER_REFERENCE_NOT_FOUND, SCHOLARSHIP_DELIVERY_NOT_FOUND, COMPETITION_APPLICATION_NOT_FOUND, COMPETITION_DELIVERY_NOT_FOUND, COMPETITION_PROVIDER_REFERENCE_NOT_FOUND.
        409 ALREADY_APPLIED, ALREADY_REGISTERED, ALREADY_CANCELLED, EVENT_FULL, CURRENT_JOB_CONFLICT, LAST_ACTIVE_ADMIN, ADMIN_ACCOUNT_REQUIRES_MANUAL_TRANSFER, ACCOUNT_DELETION_REQUEST_NOT_REVIEWABLE, ACCOUNT_DELETION_ALREADY_OPEN, COMPETITION_DELIVERY_NOT_RETRYABLE, COMPETITION_DELIVERY_IN_PROGRESS, COMPETITION_DELIVERY_NOT_IN_PROGRESS, COMPETITION_APPLICATION_NOT_DELIVERABLE, COMPETITION_PROVIDER_REFERENCE_CONFLICT, INVALID_COMPETITION_STATUS_TRANSITION, COMPETITION_APPLICATION_NOT_REVIEWABLE.
        422 NOT_A_JOB, NOT_REGISTRABLE, OPPORTUNITY_CLOSED, REGISTRATION_CLOSED, NOT_ELIGIBLE, CANNOT_WITHDRAW,
        INVALID_INPUT, START_BEFORE_PREVIOUS, COMPANY_NOT_VERIFIED, OPPORTUNITY_NOT_EDITABLE, OPPORTUNITY_NOT_DRAFT,
        OPPORTUNITY_NOT_OPEN, APPLICATION_NOT_UPDATABLE, INVALID_STATUS_TRANSITION,
        CV_NOT_PROCESSING, INVALID_CV_SUGGESTIONS, CV_SKILL_NOT_FOUND, INVALID_CV_DECISIONS,
        CV_EXPERIENCE_NEEDS_REVIEW, INVALID_CV_DATE_RANGE, CV_CREDENTIAL_NEEDS_REVIEW,
        INVALID_INTERACTION, JOB_NOT_DRAFT, NOT_A_SCHOLARSHIP,
        SCHOLARSHIP_APPLICATION_NOT_FOUND, SCHOLARSHIP_APPLICATION_NOT_REVIEWABLE, CANNOT_WITHDRAW_SCHOLARSHIP_APPLICATION, SAMPLE_DATA_NOT_REVIEWABLE,
        SCHOLARSHIP_PROVIDER_MAPPING_NOT_ALLOWED, REVIEWER_NOT_ACTIVE, SCHOLARSHIP_PROVIDER_NOT_CONFIGURED, COMPETITION_PROVIDER_MAPPING_NOT_ALLOWED, COMPETITION_PROVIDER_NOT_CONFIGURED,
        INVALID_SCHOLARSHIP_STATUS_TRANSITION, SCHOLARSHIP_DELIVERY_NOT_RETRYABLE, SCHOLARSHIP_DELIVERY_IN_PROGRESS,
        PROVIDER_EVENT_ID_CONFLICT, NOT_A_COMPETITION,
        COMPETITION_APPLICATION_NOT_FOUND, CANNOT_WITHDRAW_COMPETITION_APPLICATION,
        ACCOUNT_UNAVAILABLE, ADMIN_TARGET_NOT_VERIFIED, SOCIAL_POST_NOT_FOUND, SOCIAL_COMMENT_NOT_FOUND, ALREADY_LIKED, NOT_LIKED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- apiKeyAuth: []
  jwt: []
paths:
  /rest/v1/graduate_profiles:
    get:
      summary: 'Own profile (RLS returns only the caller''s row). Filter: ?profile_id=eq.<uid>'
      responses:
        '200':
          description: OK
    patch:
      summary: 'Update own profile. Writable columns: college, department, major, graduation_year, degree, employment_status,
        location, career_interests, work_preferences, hidden_fields'
      responses:
        '204':
          description: Updated
  /rest/v1/graduate_skills:
    get:
      summary: Own skills
      responses:
        '200':
          description: OK
    post:
      summary: Add a skill manually (source is forced to MANUAL by RLS)
      responses:
        '201':
          description: Created
    patch:
      summary: Update level / years_experience of an own skill (?skill_id=eq.X)
      responses:
        '204':
          description: Updated
    delete:
      summary: Remove own skill
      responses:
        '204':
          description: Deleted
  /rest/v1/skills:
    get:
      summary: Skills dictionary (read-only)
      responses:
        '200':
          description: OK
  /rest/v1/rpc/review_cv_suggestions:
    post:
      summary: Review extracted CV suggestions; only CONFIRMED items enter the graduate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_decisions]
              properties:
                p_decisions:
                  type: array
                  items:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [CONFIRMED, REJECTED] }
                      payload: { type: object, description: Optional corrected extraction payload }
      responses:
        '200': { description: Confirmed and rejected counts }
        '422': { description: Incomplete or invalid reviewed data }
  /rest/v1/rpc/get_career_market_insights:
    post:
      summary: Return aggregate skill demand from active platform jobs and this graduate's gaps
      responses:
        '200': { description: Market demand, personal skills and recommended gap priorities }
  /rest/v1/rpc/record_recommendation_interaction:
    post:
      summary: Record IMPRESSION, VIEW, DISMISS or NOT_INTERESTED feedback for an owned recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_opportunity_id, p_interaction_type]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_interaction_type: { type: string, enum: [IMPRESSION, VIEW, DISMISS, NOT_INTERESTED] }
      responses:
        '200': { description: Interaction recorded }
        '404': { description: Recommendation not found }
  /rest/v1/rpc/set_job_experience_requirement:
    post:
      summary: Set a draft job's minimum experience years and whether it is mandatory (company owner/recruiter or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_opportunity_id, p_minimum_experience_years, p_is_required]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_minimum_experience_years: { type: number, minimum: 0, maximum: 50, nullable: true }
                p_is_required: { type: boolean }
      responses:
        '200': { description: Requirement updated }
        '403': { description: Not company member }
        '422': { description: Job is not draft or input invalid }
  /rest/v1/career_history:
    get:
      summary: Own career history
      responses:
        '200':
          description: OK
    post:
      summary: Add a PAST record (end_date required). Use set_current_job for the current job.
      responses:
        '201':
          description: Created
    patch:
      summary: Edit own record (not is_current)
      responses:
        '204':
          description: Updated
  /rest/v1/opportunities:
    get:
      summary: Read-only catalogue. Only open opportunities (ACTIVE, not expired) plus ones you applied/registered/saved.
        Use PostgREST filters, e.g. ?type=eq.JOB&order=deadline.asc&limit=20&offset=0&select=*,job_details(*),event_details(*),opportunity_skills(*)
      responses:
        '200':
          description: OK
  /rest/v1/saved_opportunities:
    get:
      summary: Own saved
      responses:
        '200':
          description: OK
    post:
      summary: Save (body {graduate_id, opportunity_id}; graduate_id must equal your uid)
      responses:
        '201':
          description: Created
    delete:
      summary: 'Unsave: ?opportunity_id=eq.<id>'
      responses:
        '204':
          description: Deleted
  /rest/v1/applications:
    get:
      summary: Own applications (?select=*,opportunity:opportunities(title),application_status_history(*)). SEED_SAMPLE rows
        are demo history.
      responses:
        '200':
          description: OK
  /rest/v1/scholarship_applications:
    get:
      summary: Own scholarship applications (?select=*,opportunity:opportunities(title))
      responses:
        '200': { description: OK }
  /rest/v1/scholarship_application_status_history:
    get:
      summary: Status history for the caller's own scholarship applications
      responses:
        '200': { description: OK }
  /rest/v1/competition_applications:
    get:
      summary: Own competition submissions (?select=*,opportunity:opportunities(title))
      responses:
        '200': { description: OK }
  /rest/v1/competition_application_status_history:
    get:
      summary: Status history for the caller's own competition submissions
      responses:
        '200': { description: OK }
  /rest/v1/event_registrations:
    get:
      summary: Own registrations
      responses:
        '200':
          description: OK
  /rest/v1/recommendations:
    get:
      summary: Cached recommendations (closed/expired opportunities are hidden). Prefer POST /functions/v1/recommend to refresh.
      responses:
        '200':
          description: OK
  /rest/v1/notifications:
    get:
      summary: In-app notifications (?order=created_at.desc)
      responses:
        '200':
          description: OK
    patch:
      summary: 'Mark read: ?id=eq.<id> body {is_read:true}'
      responses:
        '204':
          description: Updated
  /rest/v1/rpc/apply_for_job:
    post:
      summary: Create a SUBMITTED application (one per job; eligibility and deadline enforced server-side)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_opportunity_id
              properties:
                p_opportunity_id:
                  type: string
                  format: uuid
                p_cv_document_id:
                  type: string
                  format: uuid
                p_note:
                  type: string
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
