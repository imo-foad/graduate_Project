name: issue-44-artifact-forensics

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/issue-44-artifact-forensics.yml"
      - ".github/workflows/issue-44-security-audit.yml"
      - "scripts/security/issue-44-artifact-forensics.py"
      - "scripts/security/issue-44-audit.py"
      - "scripts/security/issue-44-gitleaks.toml"
      - "tests/security/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # New commits get an independent scan; duplicate push/PR events for the same SHA serialize.
  group: issue-44-artifact-forensics-${{ github.sha }}
  cancel-in-progress: false

jobs:
  artifacts:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/security/issue-44-artifact-forensics'
    name: Forensic scan of all retained Actions run logs and artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$INSTALL_DIR"
          ARCHIVE="$INSTALL_DIR/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$ARCHIVE"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$ARCHIVE" | sha256sum --check --status
          tar -xzf "$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod 700 "$INSTALL_DIR/gitleaks"
          "$INSTALL_DIR/gitleaks" version

      - name: Verify custom secret detection, redaction, and clean fixture
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS="$RUNNER_TEMP/gitleaks-8.30.1/gitleaks"
          CANARY_DIR="$RUNNER_TEMP/gitleaks-canary"
          CLEAN_DIR="$RUNNER_TEMP/gitleaks-clean"
          CANARY_REPORT="$RUNNER_TEMP/gitleaks-canary-report.json"
          CLEAN_REPORT="$RUNNER_TEMP/gitleaks-clean-report.json"
          CANARY_LOG="$RUNNER_TEMP/gitleaks-canary.log"
          # Compose a disposable high-entropy test value at runtime; never store
          # a secret-shaped canary literal in the public repository.
          CANARY="sb_secret_$(openssl rand -hex 11)_$(openssl rand -hex 4)"
          mkdir -m 700 -p "$CANARY_DIR" "$CLEAN_DIR"
          printf '%s\n' "$CANARY" > "$CANARY_DIR/canary.txt"
          set +e
          "$GITLEAKS" dir "$CANARY_DIR" \
            --config=scripts/security/issue-44-gitleaks.toml \
            --redact=100 --report-format=json --report-path="$CANARY_REPORT" \
            > "$CANARY_LOG" 2>&1
          CANARY_STATUS=$?
          set -e
          test "$CANARY_STATUS" -eq 1
          test -s "$CANARY_REPORT"
          ! grep -Fq "$CANARY" "$CANARY_REPORT"
          ! grep -Fq "$CANARY" "$CANARY_LOG"
          "$GITLEAKS" dir "$CLEAN_DIR" \
            --config=scripts/security/issue-44-gitleaks.toml \
            --redact=100 --report-format=json --report-path="$CLEAN_REPORT" \
            > "$RUNNER_TEMP/gitleaks-clean.log" 2>&1
          test -s "$CLEAN_REPORT"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data == [], "clean fixture produced findings"' "$CLEAN_REPORT"
          echo "GITLEAKS_CANARY=DETECTED EXIT=1 REDACTION=PASS CLEAN_FIXTURE=PASS"

      - name: Test safe extraction and fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/security/issue-44-artifact-forensics.py
          python3 -m unittest discover -s tests/security -p 'test_issue_44_artifact_forensics.py' -v

      - name: Download and inspect retained Actions run logs and artifacts without unsafe extraction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/security/issue-44-artifact-forensics.py
