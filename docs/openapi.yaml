openapi: 3.0.3
info:
  title: Alumni Connect AI - Backend API (Supabase)
  version: 0.1.0
  description: 'Contract for the Android team. Every request needs `apikey: <anon key>`. Password/refresh token, public email-first registration and the Supabase email confirmation endpoint do not need a user JWT; every other operation needs `Authorization: Bearer <user JWT>`. Registration verifies a fake `SYNTH-...` identifier against the local synthetic registry; it is not real institutional or National-ID verification and it never requests an SMS OTP. Phone is optional contact data. Errors from RPCs: HTTP status = business meaning, `message` = stable error code, `details` = optional extra. All data is synthetic. Match Score is NOT a hiring probability.'
servers:
- url: '{supabaseUrl}'
  variables:
    supabaseUrl:
      default: http://127.0.0.1:54321
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Project anon/publishable key. Required on EVERY request, including login. Safe to ship in the app.
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access_token from /auth/v1/token. Required on every operation except the token endpoint itself.
  schemas:
    OpportunityType:
      type: string
      description: 'Active opportunity types. Final product decision 2026-11-26: only JOB, INTERNSHIP and TRAINING are
        active. Every other value is rejected by the database and is never returned as actionable. Matching is exact
        and case-sensitive.'
      enum:
      - JOB
      - INTERNSHIP
      - TRAINING
    StudentAcademicRecord:
      type: object
      required: [profile_id, institution_ref, department, major, academic_track, academic_level, gpa, gpa_scale, record_source]
      properties:
        profile_id: { type: string, format: uuid }
        institution_ref: { type: string, pattern: '^SYNTH-STU-[0-9]{4}$' }
        department: { type: string }
        major: { type: string }
        academic_track:
          type: string
          enum:
          - Software Engineering
          - Artificial Intelligence
          - Data Science and Analytics
          - Cybersecurity
          - Mobile Development
          - Networks and Cloud
          - Information Systems
        academic_level: { type: integer, minimum: 1, maximum: 5 }
        gpa: { type: number, minimum: 0, maximum: 4 }
        gpa_scale:
          type: number
          enum: [4.0]
          description: Synthetic demo convention only; not a statement of the university grading policy.
        record_source:
          type: string
          enum: [SYNTHETIC_SEED, INSTITUTION_PROVIDER, MANUAL_ADMIN]
    FacultyAcademicRecord:
      type: object
      required: [profile_id, institution_ref, department, specialization, academic_title, record_source]
      properties:
        profile_id: { type: string, format: uuid }
        institution_ref: { type: string, pattern: '^SYNTH-FAC-[0-9]{4}$' }
        department: { type: string }
        specialization: { type: string }
        academic_title:
          type: string
          enum: [PROFESSOR, ASSOCIATE_PROFESSOR, ASSISTANT_PROFESSOR, LECTURER, ASSISTANT_LECTURER, TEACHING_ASSISTANT]
        record_source:
          type: string
          enum: [SYNTHETIC_SEED, INSTITUTION_PROVIDER, MANUAL_ADMIN]
    Opportunity:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/OpportunityType' }
        title: { type: string }
        company_name: { type: string, nullable: true }
        company_id: { type: string, format: uuid, nullable: true }
        company_verification_status:
          type: string
          nullable: true
          enum: [PENDING_REVIEW, VERIFIED, REJECTED, SUSPENDED]
          description: Safe status projection; company details remain member/admin-only.
        description: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED, EXPIRED, CANCELLED] }
        requires_cv:
          type: boolean
          default: false
          description: Active CV required only when true; false by default for JOB and INTERNSHIP.
        capacity: { type: integer, nullable: true }
        registered_count: { type: integer }
        waitlist_enabled: { type: boolean }
        registration_opens_at: { type: string, format: date-time, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      properties:
        message:
          type: string
          example: ALREADY_APPLIED
        details:
          type: string
          nullable: true
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opportunity_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - SHORTLISTED
          - INTERVIEW
          - ACCEPTED
          - REJECTED
          - WITHDRAWN
          - SAMPLE_UNDER_REVIEW
          - SAMPLE_INTERVIEW
          - SAMPLE_ACCEPTED
          - SAMPLE_REJECTED
        status_source:
          type: string
          enum:
          - APP_ACTION
          - COMPANY_ACTION
          - ADMIN_ACTION
          - SEED_SAMPLE
        applied_at:
          type: string
          format: date-time
    SocialPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 5000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SocialFeedItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        author_name: { type: string }
        author_avatar_url: { type: string, nullable: true }
        content: { type: string, minLength: 1, maxLength: 5000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        likes_count: { type: integer, format: int64 }
        comments_count: { type: integer, format: int64 }
        liked_by_me: { type: boolean }
    SocialComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author_name: { type: string }
        author_avatar_url: { type: string, nullable: true }
        content: { type: string, minLength: 1, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SocialCommentMutation:
      type: object
      description: Mutation response returned to the authenticated comment author; author_id is the caller's own id.
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventRegistration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opportunity_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - REGISTERED
          - WAITLISTED
          - CANCELLED
    CareerRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_name:
          type: string
        job_title:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        is_current:
          type: boolean
    Recommendation:
      type: object
      properties:
        opportunity_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Match Score (not an acceptance probability)
        band:
          type: string
          enum:
          - HIGH
          - GOOD
          - MEDIUM
          - LOW
        matched_skill_ids:
          type: array
          items:
            type: string
        missing_skill_ids:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: object
        reasons:
          type: array
          items:
            type: string
        explanation_ar:
          type: string
        availability_status:
          type: string
          nullable: true
          enum:
          - OPEN
          - UPCOMING
          - WAITLIST_ONLY
          description: |
            TRAINING registration availability at read time. Always null for JOB and INTERNSHIP, which use
            the application workflow, and for a TRAINING with no registration data. A TRAINING with a
            future registration window is still returned with UPCOMING (score 0). Closed opportunities and
            full TRAINING without a waitlist are omitted from `items` entirely, so `FULL`/`CLOSED` never
            appear here. Clients should render WAITLIST_ONLY as "join waitlist".
        model_version:
          type: string
        generated_at:
          type: string
          format: date-time
        opportunity:
          type: object
          description: Embedded opportunity (id,type,title,company_name,location,attendance_mode,status,deadline,start_at,end_at,registration_opens_at,capacity,registered_count,waitlist_enabled)
    CareerSkillEvidence:
      type: object
      required: [skill_id, level, role, weight, contribution]
      properties:
        skill_id: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
        role: { type: string, enum: [CORE, SUPPORTING] }
        weight: { type: integer, minimum: 1 }
        contribution: { type: number, minimum: 0, maximum: 100 }
    CareerPathMatch:
      type: object
      required:
      - id
      - label
      - score
      - matched_skill_ids
      - matched_core_skill_ids
      - matched_supporting_skill_ids
      - specialization_signal_skill_ids
      - missing_core_skill_ids
      - next_skill_ids
      - core_match_count
      - required_core_match_count
      - skill_evidence
      - explanation_ar
      properties:
        id: { type: string }
        label: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Weighted confirmed-skill coverage, not a hiring probability.
        matched_skill_ids:
          type: array
          items: { type: string }
        matched_core_skill_ids:
          type: array
          items: { type: string }
        matched_supporting_skill_ids:
          type: array
          items: { type: string }
        specialization_signal_skill_ids:
          type: array
          description: Matched core skills satisfying any required specialization gate for this path.
          items: { type: string }
        missing_core_skill_ids:
          type: array
          items: { type: string }
        next_skill_ids:
          type: array
          maxItems: 3
          items: { type: string }
        core_match_count: { type: integer, minimum: 0 }
        required_core_match_count: { type: integer, minimum: 1 }
        skill_evidence:
          type: array
          items: { $ref: '#/components/schemas/CareerSkillEvidence' }
        explanation_ar: { type: string }
    CareerProfile:
      type: object
      required: [primary_path, paths, disclaimer]
      properties:
        primary_path:
          allOf:
          - $ref: '#/components/schemas/CareerPathMatch'
          nullable: true
        paths:
          type: array
          description: Every path meeting the minimum core-skill evidence threshold, sorted by fit score.
          items: { $ref: '#/components/schemas/CareerPathMatch' }
        disclaimer: { type: string }
    PasswordGrantRequest:
      type: object
      required:
      - password
      additionalProperties: false
      oneOf:
      - required: [email]
      - required: [phone]
      properties:
        email:
          type: string
          format: email
          description: Canonical identifier for email-first accounts.
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Legacy synthetic demo accounts only. Phone is not used for new registrations.
        password:
          type: string
          format: password
    RefreshTokenGrantRequest:
      type: object
      required:
      - refresh_token
      additionalProperties: false
      properties:
        refresh_token:
          type: string
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
        expires_at:
          type: integer
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
    AuthError:
      type: object
      description: Supabase Auth error body (field set can vary by version; not verified against a live project).
      properties:
        code:
          type: integer
        error_code:
          type: string
          example: invalid_credentials
        msg:
          type: string
    GatewayError:
      type: object
      properties:
        message:
          type: string
          example: No API key found in request
    RecommendError:
      type: object
      properties:
        error:
          type: string
          enum:
          - UNAUTHENTICATED
          - METHOD_NOT_ALLOWED
          - CANDIDATES_FAILED
          - SAVE_FAILED
          - STALE_SNAPSHOT
          - READ_FAILED
          - PROFILE_SKILLS_READ_FAILED
        retryable:
          type: boolean
        attempts:
          type: integer
        code:
          type: string
  responses:
    BusinessError:
      description: >-
        HTTP status mirrors the business meaning; body.message is a stable code.
        401 UNAUTHENTICATED.
        403 ADMIN_REQUIRED, NOT_COMPANY_MEMBER, GRADUATE_PROFILE_REQUIRED.
        404 OPPORTUNITY_NOT_FOUND, APPLICATION_NOT_FOUND, REGISTRATION_NOT_FOUND, CV_NOT_FOUND, COMPANY_NOT_FOUND, USER_NOT_FOUND, MEMBERSHIP_NOT_FOUND, JOB_NOT_FOUND, RECOMMENDATION_NOT_FOUND, CV_SUGGESTION_NOT_FOUND, ACCOUNT_DELETION_REQUEST_NOT_FOUND, ADMIN_MEMBERSHIP_NOT_FOUND, IDENTITY_NOT_FOUND.
        409 ALREADY_APPLIED, ALREADY_REGISTERED, ALREADY_CANCELLED, EVENT_FULL, CURRENT_JOB_CONFLICT, LAST_ACTIVE_ADMIN, ADMIN_ACCOUNT_REQUIRES_MANUAL_TRANSFER, ACCOUNT_DELETION_REQUEST_NOT_REVIEWABLE, ACCOUNT_DELETION_ALREADY_OPEN, IDENTITY_ALREADY_LINKED, EMAIL_ALREADY_REGISTERED, EMAIL_NOT_VERIFIED, IDENTITY_NOT_VERIFIED.
        422 NOT_A_JOB, NOT_APPLICATION_OPPORTUNITY, CV_REQUIRED, NOT_REGISTRABLE, OPPORTUNITY_CLOSED, REGISTRATION_CLOSED, NOT_ELIGIBLE, CANNOT_WITHDRAW,
        INVALID_INPUT, START_BEFORE_PREVIOUS, COMPANY_NOT_VERIFIED, OPPORTUNITY_NOT_EDITABLE, OPPORTUNITY_NOT_DRAFT,
        OPPORTUNITY_NOT_OPEN, APPLICATION_NOT_UPDATABLE, INVALID_STATUS_TRANSITION,
        CV_NOT_PROCESSING, INVALID_CV_SUGGESTIONS, CV_SKILL_NOT_FOUND, INVALID_CV_DECISIONS,
        CV_EXPERIENCE_NEEDS_REVIEW, INVALID_CV_DATE_RANGE, CV_CREDENTIAL_NEEDS_REVIEW,
        INVALID_INTERACTION, JOB_NOT_DRAFT, INVALID_IDENTITY, IDENTITY_WITHOUT_VERIFIED_ROLE,
        ACCOUNT_UNAVAILABLE, ADMIN_TARGET_NOT_VERIFIED, SOCIAL_POST_NOT_FOUND, SOCIAL_COMMENT_NOT_FOUND, ALREADY_LIKED, NOT_LIKED.
        409 ALREADY_REPORTED, SOCIAL_REPORT_ALREADY_REVIEWED, SOCIAL_CONTENT_ALREADY_VISIBLE.
        422 CANNOT_REPORT_OWN_CONTENT, INVALID_RATE_LIMIT_SUBJECT.
        403 MODERATION_AUDIT_IMMUTABLE, SERVICE_ROLE_REQUIRED, SOCIAL_AUTHOR_MISMATCH.
        404 SOCIAL_CONTENT_NOT_FOUND, SOCIAL_REPORT_NOT_FOUND.
        429 RATE_LIMIT_EXCEEDED.
        500 RATE_LIMIT_POLICY_NOT_FOUND, UNSUPPORTED_SOCIAL_RATE_LIMIT_TARGET.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- apiKeyAuth: []
  jwt: []
paths:
  /rest/v1/graduate_profiles:
    get:
      summary: 'Own profile (RLS returns only the caller''s row). Filter: ?profile_id=eq.<uid>'
      responses:
        '200':
          description: OK
    patch:
      summary: 'Update own profile. Writable columns: college, department, major, graduation_year, degree, employment_status,
        location, career_interests, work_preferences, hidden_fields'
      responses:
        '204':
          description: Updated
  /rest/v1/graduate_skills:
    get:
      summary: Own skills
      responses:
        '200':
          description: OK
    post:
      summary: Add a skill manually (source is forced to MANUAL by RLS)
      responses:
        '201':
          description: Created
    patch:
      summary: Update level / years_experience of an own skill (?skill_id=eq.X)
      responses:
        '204':
          description: Updated
    delete:
      summary: Remove own skill
      responses:
        '204':
          description: Deleted
  /rest/v1/student_academic_records:
    get:
      summary: Read the authenticated student's own typed academic record; RLS returns only the caller's row.
      description: Read-only to clients. Insert, update and delete are service-role only. Synthetic GPA scale is a demo convention.
      responses:
        '200':
          description: Own student academic record (zero or one row).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentAcademicRecord'
  /rest/v1/faculty_academic_records:
    get:
      summary: Read the authenticated faculty member's own typed academic record; RLS returns only the caller's row.
      description: Read-only to clients. Insert, update and delete are service-role only. Synthetic records are simulated, not institution verification.
      responses:
        '200':
          description: Own faculty academic record (zero or one row).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyAcademicRecord'
  /rest/v1/skills:
    get:
      summary: Skills dictionary (read-only)
      responses:
        '200':
          description: OK
  /rest/v1/rpc/review_cv_suggestions:
    post:
      summary: Review extracted CV suggestions; only CONFIRMED items enter the graduate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_decisions]
              properties:
                p_decisions:
                  type: array
                  items:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [CONFIRMED, REJECTED] }
                      payload: { type: object, description: Optional corrected extraction payload }
      responses:
        '200': { description: Confirmed and rejected counts }
        '422': { description: Incomplete or invalid reviewed data }
  /rest/v1/rpc/get_career_market_insights:
    post:
      summary: Return aggregate skill demand from active platform jobs and this graduate's gaps
      responses:
        '200': { description: Market demand, personal skills and recommended gap priorities }
  /rest/v1/rpc/record_recommendation_interaction:
    post:
      summary: Record IMPRESSION, VIEW, DISMISS or NOT_INTERESTED feedback for an owned recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_opportunity_id, p_interaction_type]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_interaction_type: { type: string, enum: [IMPRESSION, VIEW, DISMISS, NOT_INTERESTED] }
      responses:
        '200': { description: Interaction recorded }
        '404': { description: Recommendation not found }
  /rest/v1/rpc/set_job_experience_requirement:
    post:
      summary: Set a draft job's minimum experience years and whether it is mandatory (company owner/recruiter or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_opportunity_id, p_minimum_experience_years, p_is_required]
              properties:
                p_opportunity_id: { type: string, format: uuid }
                p_minimum_experience_years: { type: number, minimum: 0, maximum: 50, nullable: true }
                p_is_required: { type: boolean }
      responses:
        '200': { description: Requirement updated }
        '403': { description: Not company member }
        '422': { description: Job is not draft or input invalid }
  /rest/v1/career_history:
    get:
      summary: Own career history
      responses:
        '200':
          description: OK
    post:
      summary: Add a PAST record (end_date required). Use set_current_job for the current job.
      responses:
        '201':
          description: Created
    patch:
      summary: Edit own record (not is_current)
      responses:
        '204':
          description: Updated
  /functions/v1/register:
    post:
      summary: Public email-first signup against the local synthetic identity registry; requests an email confirmation and never sends an SMS OTP
      security:
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, full_name, synthetic_id]
              properties:
                email: { type: string, format: email, maxLength: 254, description: Canonical Auth identifier and confirmation target. }
                phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: Optional contact data. Never used as an Auth identifier or for OTP. }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
                full_name: { type: string, minLength: 2, maxLength: 200 }
                synthetic_id: { type: string, pattern: '^SYNTH-[A-Z0-9]+(-[A-Z0-9]+)*$', maxLength: 48, description: 'Fake demo identifier from the local registry, e.g. SYNTH-STUDENT-0001. A real National ID is rejected.' }
                resend_confirmation: { type: boolean, default: false, description: 'Set true only when the user explicitly asks for another confirmation email. Normal retries are idempotent and do not send again.' }
      responses:
        '202': { description: 'PENDING_EMAIL_VERIFICATION. email_confirmation is REQUESTED for a new message, RESENT for an explicit resend, or ALREADY_REQUESTED for an idempotent retry; email_delivery is always UNCONFIRMED until independently verified. Auth accepting the request is not proof of delivery.' }
        '409': { description: 'PHONE_ALREADY_REGISTERED, EMAIL_ALREADY_REGISTERED or IDENTITY_ALREADY_LINKED' }
        '422': { description: 'Invalid input, INVALID_RESEND_CONFIRMATION, INVALID_SYNTHETIC_ID, or SYNTHETIC_IDENTITY_NOT_FOUND' }
        '429': { description: 'EMAIL_RESEND_COOLDOWN (includes retry_after_seconds) or EMAIL_RESEND_MAX_ATTEMPTS. An explicit resend is limited to five attempts with a 60-second cooldown.' }
        '503': { description: 'SYNTHETIC_REGISTRY_UNAVAILABLE, EMAIL_CONFIRMATION_REQUEST_FAILED, REGISTRATION_RETRY_UNAVAILABLE, or REGISTRATION_EMAIL_STATE_UNAVAILABLE.' }
  /functions/v1/finalize-registration:
    post:
      summary: Activate the pending email-first account after Supabase confirms the email and at least one synthetic identity is associated
      responses:
        '200': { description: 'Account activated; requires auth.users.email_confirmed_at and at least one VERIFIED human identity' }
        '401': { description: 'UNAUTHENTICATED' }
        '403': { description: 'ACCOUNT_UNAVAILABLE' }
        '409': { description: 'EMAIL_NOT_VERIFIED or IDENTITY_NOT_VERIFIED' }
        '500': { description: 'REGISTRATION_FINALIZE_FAILED' }
  /rest/v1/opportunities:
    get:
      summary: Read-only catalogue. Only open opportunities (ACTIVE, not expired) plus ones you applied/registered/saved.
        The active scope is exactly JOB, INTERNSHIP and TRAINING (schema OpportunityType). Use PostgREST filters,
        e.g. ?type=eq.JOB&order=deadline.asc&limit=20&offset=0&select=*,job_details(*),event_details(*),opportunity_skills(*),requires_cv
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Opportunity' }
  /rest/v1/saved_opportunities:
    get:
      summary: Own saved
      responses:
        '200':
          description: OK
    post:
      summary: Save (body {graduate_id, opportunity_id}; graduate_id must equal your uid)
      responses:
        '201':
          description: Created
    delete:
      summary: 'Unsave: ?opportunity_id=eq.<id>'
      responses:
        '204':
          description: Deleted
  /rest/v1/applications:
    get:
      summary: Own applications (?select=*,opportunity:opportunities(title),application_status_history(*)). SEED_SAMPLE rows
        are demo history.
      responses:
        '200':
          description: OK
  /rest/v1/event_registrations:
    get:
      summary: Own TRAINING registrations (REGISTERED, WAITLISTED, CANCELLED)
      responses:
        '200':
          description: OK
  /rest/v1/event_registration_status_history:
    get:
      summary: Own append-only registration status history, including automatic FIFO promotion events
      responses:
        '200':
          description: OK
  /rest/v1/recommendations:
    get:
      summary: Cached recommendations (closed/expired opportunities are hidden). Prefer POST /functions/v1/recommend to refresh.
      responses:
        '200':
          description: OK
  /rest/v1/notifications:
    get:
      summary: In-app notifications (?order=created_at.desc)
      responses:
        '200':
          description: OK
    patch:
      summary: 'Mark read: ?id=eq.<id> body {is_read:true}'
      responses:
        '204':
          description: Updated
  /rest/v1/rpc/apply_for_job:
    post:
      summary: Create a SUBMITTED application for JOB or INTERNSHIP; CV is optional unless requires_cv=true; eligibility, deadline and duplicate rules are enforced server-side
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_opportunity_id
              properties:
                p_opportunity_id:
                  type: string
                  format: uuid
                p_cv_document_id:
                  type: string
                  format: uuid
                p_note:
                  type: string
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/finalize_registration:
    post:
      summary: Complete email-first registration after email confirmation and synthetic identity association
      responses:
        '200':
          description: '{account_status: ACTIVE, verified_identities: n, email_verified_at}. Requires auth.users.email_confirmed_at
            and at least one VERIFIED human identity.'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/list_my_identities:
    post:
      summary: Own verified/pending institutional identities (STUDENT, GRADUATE, FACULTY; multiple allowed)
      responses:
        '200':
          description: Array of {id, identity_type, institution_ref, status, verification_source, verified_at, attributes}
  /rest/v1/rpc/review_human_identity:
    post:
      summary: Platform admin verifies or revokes one identity (manual review fallback)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_identity_id
              - p_decision
              properties:
                p_identity_id:
                  type: string
                  format: uuid
                p_decision:
                  type: string
                  enum: [VERIFIED, REVOKED]
                p_note:
                  type: string
      responses:
        '200':
          description: '{id, status}'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/transfer_company_ownership:
    post:
      summary: Current active OWNER (or platform admin) transfers ownership to an existing active member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_company_id
              - p_new_owner_id
              properties:
                p_company_id:
                  type: string
                  format: uuid
                p_new_owner_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The new OWNER membership row; the previous owner becomes RECRUITER. Audited.
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/delete_cv_document:
    post:
      summary: Delete own CV metadata and enqueue cleanup of the private Storage object (owner only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_cv_document_id
              properties:
                p_cv_document_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: '{deleted: true, cv_document_id, cleanup_queued: true}. The object is removed by the
            service-role worker through the Storage API; retry is idempotent.'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/get_social_feed:
    post:
      summary: Keyset-paginated feed for authenticated active graduates; exposes display name and non-hidden avatar only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_before_created_at: { type: string, format: date-time, nullable: true }
                p_before_id: { type: string, format: uuid, nullable: true }
                p_limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialFeedItem' }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/create_social_post:
    post:
      summary: Create a post as the authenticated graduate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_content]
              properties:
                p_content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { description: Created post, content: { application/json: { schema: { $ref: '#/components/schemas/SocialPost' } } } }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/update_social_post:
    post:
      summary: Edit only the authenticated author's post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id, p_content]
              properties:
                p_post_id: { type: string, format: uuid }
                p_content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { description: Updated post, content: { application/json: { schema: { $ref: '#/components/schemas/SocialPost' } } } }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/delete_social_post:
    post:
      summary: Delete only the authenticated author's post and cascade its comments and likes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id]
              properties:
                p_post_id: { type: string, format: uuid }
      responses:
        '200': { description: true when deleted }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/get_social_post_comments:
    post:
      summary: List comments for an active feed post with keyset pagination and display-only author identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id]
              properties:
                p_post_id: { type: string, format: uuid }
                p_before_created_at: { type: string, format: date-time, nullable: true }
                p_before_id: { type: string, format: uuid, nullable: true }
                p_limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialComment' }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/add_social_comment:
    post:
      summary: Add a comment as the authenticated graduate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id, p_content]
              properties:
                p_post_id: { type: string, format: uuid }
                p_content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Created comment, content: { application/json: { schema: { $ref: '#/components/schemas/SocialCommentMutation' } } } }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/update_social_comment:
    post:
      summary: Edit only the authenticated author's comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_comment_id, p_content]
              properties:
                p_comment_id: { type: string, format: uuid }
                p_content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Updated comment, content: { application/json: { schema: { $ref: '#/components/schemas/SocialCommentMutation' } } } }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/delete_social_comment:
    post:
      summary: Delete only the authenticated author's comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_comment_id]
              properties:
                p_comment_id: { type: string, format: uuid }
      responses:
        '200': { description: true when deleted }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/like_social_post:
    post:
      summary: Like a feed post once per graduate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id]
              properties:
                p_post_id: { type: string, format: uuid }
      responses:
        '200': { description: true when liked }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/unlike_social_post:
    post:
      summary: Remove the authenticated graduate's like
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_post_id]
              properties:
                p_post_id: { type: string, format: uuid }
      responses:
        '200': { description: true when unliked }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/create_social_content_report:
    post:
      summary: Report another graduate's visible post or comment; one open report per reporter and target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_target_type, p_target_id, p_category]
              properties:
                p_target_type: { type: string, enum: [POST, COMMENT] }
                p_target_id: { type: string, format: uuid }
                p_category: { type: string, enum: [SPAM, HARASSMENT, HATE_OR_VIOLENCE, THREATS, SCAM, PRIVACY, INAPPROPRIATE, OTHER] }
                p_details: { type: string, maxLength: 1000, nullable: true }
      responses:
        '200':
          description: Report opened
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: string, format: uuid }
                    status: { type: string, enum: [OPEN] }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/get_my_social_reports:
    post:
      summary: List only the authenticated graduate's own abuse reports
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Report history for the authenticated graduate
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: string, format: uuid }
                    target_type: { type: string, enum: [POST, COMMENT] }
                    status: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
                    category: { type: string, enum: [SPAM, HARASSMENT, HATE_OR_VIOLENCE, THREATS, SCAM, PRIVACY, INAPPROPRIATE, OTHER] }
                    created_at: { type: string, format: date-time }
                    reviewed_at: { type: string, format: date-time, nullable: true }
                    resolution_note: { type: string, nullable: true }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/get_social_moderation_queue:
    post:
      summary: Platform-admin-only moderation queue with target content and reporter/author display information
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                p_status: { type: string, enum: [OPEN, RESOLVED, DISMISSED, ALL], default: OPEN }
                p_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Moderation reports visible to an active platform administrator
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: string, format: uuid }
                    target_type: { type: string, enum: [POST, COMMENT] }
                    target_id: { type: string, format: uuid }
                    category: { type: string }
                    details: { type: string, nullable: true }
                    report_status: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
                    created_at: { type: string, format: date-time }
                    reporter_id: { type: string, format: uuid }
                    reporter_name: { type: string, nullable: true }
                    target_author_id: { type: string, format: uuid, nullable: true }
                    target_author_name: { type: string, nullable: true }
                    content: { type: string }
                    content_moderation_status: { type: string, enum: [VISIBLE, HIDDEN, REMOVED, MISSING] }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/moderate_social_report:
    post:
      summary: Active platform admin hides/removes reported content or dismisses a report; action is audited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_report_id, p_action, p_reason]
              properties:
                p_report_id: { type: string, format: uuid }
                p_action: { type: string, enum: [HIDE, REMOVE, DISMISS] }
                p_reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200':
          description: Moderation decision and resulting state
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: string, format: uuid }
                    status: { type: string, enum: [RESOLVED, DISMISSED] }
                    content_moderation_status: { type: string, enum: [HIDDEN, REMOVED, MISSING, UNCHANGED] }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/restore_social_content:
    post:
      summary: Active platform admin restores previously hidden or removed social content and writes an audit event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_target_type, p_target_id, p_reason]
              properties:
                p_target_type: { type: string, enum: [POST, COMMENT] }
                p_target_id: { type: string, format: uuid }
                p_reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        '200': { description: true when content is restored }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/get_social_moderation_history:
    post:
      summary: Active platform-admin-only append-only moderation audit history for one content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_target_type, p_target_id]
              properties:
                p_target_type: { type: string, enum: [POST, COMMENT] }
                p_target_id: { type: string, format: uuid }
                p_limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Moderation events for the selected content item
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event_id: { type: string, format: uuid }
                    action: { type: string, enum: [HIDE, REMOVE, RESTORE, DISMISS_REPORT, RESOLVE_MISSING_TARGET] }
                    actor_user_id: { type: string, format: uuid }
                    reason: { type: string }
                    occurred_at: { type: string, format: date-time }
        4XX: { $ref: '#/components/responses/BusinessError' }
  /rest/v1/rpc/withdraw_application:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_application_id
              properties:
                p_application_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Application
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/register_for_event:
    post:
      summary: Direct TRAINING registration only (REGISTERED or FIFO WAITLISTED; no organizer approval)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_opportunity_id
              properties:
                p_opportunity_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistration'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/cancel_event_registration:
    post:
      summary: Cancel own TRAINING registration; confirmed-seat cancellation promotes the oldest eligible waitlisted user atomically
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_opportunity_id
              properties:
                p_opportunity_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Registration
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/set_current_job:
    post:
      summary: Graduate-only. Requires the caller's own graduate_profiles row (403 GRADUATE_PROFILE_REQUIRED). Closes the current job (if any) and starts a new one atomically; sets employment_status=EMPLOYED.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_company_name
              - p_job_title
              - p_start_date
              properties:
                p_company_name:
                  type: string
                p_job_title:
                  type: string
                p_start_date:
                  type: string
                  format: date
                p_field:
                  type: string
                p_description:
                  type: string
      responses:
        '200':
          description: New record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerRecord'
        4XX:
          $ref: '#/components/responses/BusinessError'
  /rest/v1/rpc/get_opportunity_eligibility:
    post:
      summary: List failed hard requirements for the caller, e.g. ["MISSING_CERTIFICATION:Security+"]. Empty = eligible.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - p_opportunity_id
              properties:
                p_opportunity_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: text[] of failed requirements
  /rest/v1/rpc/confirm_cv_suggestions:
    post:
      summary: Confirm/reject pending CV skill suggestions (nothing is saved without this call)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_confirm:
                  type: array
                  items:
                    type: string
                    format: uuid
                p_reject:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - p_confirm
      responses:
        '200':
          description: '{confirmed, rejected}'
  /rest/v1/rpc/get_my_insights:
    post:
      summary: Personal insights for the caller only
      responses:
        '200':
          description: JSON
  /rest/v1/rpc/get_skill_gaps:
    post:
      summary: Most frequent missing skills with learning opportunities
      responses:
        '200':
          description: JSON
  /functions/v1/recommend:
    post:
      summary: Compute (only when inputs changed or force=true) and return ranked recommendations. Only active opportunity
        types and verified-company listings are candidates; closed/full training availability is filtered. Deterministic scoring;
        no external AI call in v0.1.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                    - cache
                    - computed
                  model_version:
                    type: string
                  ai_mode:
                    type: string
                    example: deterministic
                  disclaimer:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recommendation'
                  career_profile:
                    $ref: '#/components/schemas/CareerProfile'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
        '409':
          description: 'STALE_SNAPSHOT: profile kept changing during calculation (3 bounded attempts); previous cache is untouched;
            retry later'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
        '500':
          description: CANDIDATES_FAILED / SAVE_FAILED / READ_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendError'
  /auth/v1/token:
    post:
      summary: Sign in (password grant) or renew the session (refresh_token grant). No pre-existing JWT is needed; the apikey
        header IS needed.
      security:
      - apiKeyAuth: []
      parameters:
      - name: grant_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - password
          - refresh_token
        description: password -> body PasswordGrantRequest; refresh_token -> body RefreshTokenGrantRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PasswordGrantRequest'
              - $ref: '#/components/schemas/RefreshTokenGrantRequest'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid credentials or invalid/used refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '401':
          description: Missing or wrong apikey header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
  /rest/v1/profiles:
    get:
      summary: Own profile row
      responses: &id001
        '200':
          description: OK
    patch:
      summary: Update full_name only. avatar_url is server-managed; no client avatar upload endpoint is currently supported.
      responses:
        '204':
          description: Updated
  /rest/v1/projects:
    get:
      summary: Own projects
      responses: *id001
    post:
      summary: Add own project
      responses:
        '201':
          description: Created
    patch:
      summary: Edit own
      responses:
        '204':
          description: Updated
    delete:
      summary: Delete own
      responses:
        '204':
          description: Deleted
  /rest/v1/certifications:
    get:
      summary: Own certifications
      responses: *id001
    post:
      summary: Add own certification
      responses:
        '201':
          description: Created
    patch:
      summary: Edit own
      responses:
        '204':
          description: Updated
    delete:
      summary: Delete own
      responses:
        '204':
          description: Deleted
  /rest/v1/recommendation_interactions:
    get:
      summary: Own recommendation impressions, views, saves, applications, registrations and feedback
      responses: *id001
  /rest/v1/courses:
    get:
      summary: Own courses and training history
      responses: *id001
    post:
      summary: Add a course manually; source is server-defaulted to SELF_REPORTED
      responses:
        '201':
          description: Created
    patch:
      summary: Edit own course details without changing provenance
      responses:
        '204':
          description: Updated
    delete:
      summary: Delete own course
      responses:
        '204':
          description: Deleted
  /rest/v1/human_identities:
    get:
      summary: Own institutional identities only (RLS-scoped; STUDENT/GRADUATE/FACULTY; multiple rows allowed).
        Writes happen only through the service-role verification contract.
      responses:
        '200':
          description: OK
  /rest/v1/cv_documents:
    get:
      summary: Own CV records
      responses: *id001
    post:
      summary: Register an uploaded CV (storage_path must start with <uid>/)
      responses:
        '201':
          description: Created
    patch:
      summary: Set is_active (deactivate the previous one first)
      responses:
        '204':
          description: Updated
    # Direct DELETE is revoked: deletion must go through /rest/v1/rpc/delete_cv_document so the
    # private Storage object is recorded in the durable cleanup ledger.
  /rest/v1/cv_suggestions:
    get:
      summary: Pending/decided CV skill suggestions (confirm via RPC)
      responses: *id001
  /rest/v1/job_details:
    get:
      summary: Job details (embed from opportunities)
      responses: *id001
  /rest/v1/event_details:
    get:
