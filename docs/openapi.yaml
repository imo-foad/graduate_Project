      summary: Platform-admin-only manual retry after delivery failure or provider configuration is corrected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [p_application_id]
              properties:
                p_application_id: { type: string, format: uuid }
      responses:
        '200': { description: Delivery returned to PENDING; invoke deliver-scholarship to process it }
        4XX: { $ref: '#/components/responses/BusinessError' }
